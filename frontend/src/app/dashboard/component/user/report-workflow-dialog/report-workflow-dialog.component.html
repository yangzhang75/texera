<div class="report-dialog">
  <p class="report-target">
    Reporting the public workflow <b>{{ data.name }}</b> (ID {{ data.wid }}).
  </p>

  <label class="report-label">Reason</label>
  <nz-select
    class="report-reason"
    [(ngModel)]="reason"
    nzPlaceHolder="Select a reason">
    <nz-option
      *ngFor="let r of reasons"
      [nzValue]="r"
      [nzLabel]="r"></nz-option>
  </nz-select>

  <label class="report-label">Details (optional)</label>
  <textarea
    nz-input
    class="report-detail"
    [(ngModel)]="detail"
    rows="4"
    maxlength="1000"
    placeholder="Add any context that helps a moderator review this workflow."></textarea>

  <div class="report-actions">
    <button
      nz-button
      (click)="cancel()"
      [disabled]="submitting">
      Cancel
    </button>
    <button
      nz-button
      nzType="primary"
      nzDanger
      [nzLoading]="submitting"
      [disabled]="!reason"
      (click)="submit()">
      Submit report
    </button>
  </div>
</div>
