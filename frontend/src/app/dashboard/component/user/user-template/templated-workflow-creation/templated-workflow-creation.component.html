<div class="tw-form">
  <header class="tw-header">
    <h2 class="job-title">Build Workflow from Template</h2>
    <p class="tw-subtitle">Set the parameters below and click Submit. A new workflow is created under Your Work &gt; Workflows, where you can open and run it.</p>
  </header>

  <div *ngIf="sections.length === 0" class="empty-state">
    No configurable parameters in this template.
  </div>

  <div *ngFor="let section of sections" class="template-section">
    <h3 class="template-section-title">{{ section.label }}</h3>
    <form [formGroup]="section.form" class="template-section-body">
      <formly-form
        [model]="section.model"
        [fields]="section.fields"
        [form]="section.form">
      </formly-form>
    </form>
  </div>

  <div class="tw-actionbar" *ngIf="sections.length > 0">
    <button
      nz-button
      nzType="primary"
      class="tw-submit"
      [class.tw-submit-idle]="submitIdle"
      [disabled]="submitDisabled"
      (click)="onJobFormSubmitted()">
      Submit
    </button>
  </div>
</div>

<!--
  No inline workspace preview here: rendering an embedded workspace required either a persisted
  workflow (which spawned a stray "created from template" workflow on open) or template mode (which
  showed the authoring toolbar). The build page is the "configure parameters -> Submit" step; the
  generated workflow is opened/run from Your Work > Workflows after Submit.
-->
