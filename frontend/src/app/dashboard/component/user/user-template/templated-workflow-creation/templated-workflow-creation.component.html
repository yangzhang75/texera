<div class="tw-page">
  <header class="tw-header">
    <h2 class="tw-title">Configure Template</h2>
    <p class="tw-subtitle">Fill in the parameters below, then apply them to your workflow.</p>
  </header>

  <div *ngIf="sections.length === 0" class="tw-empty">
    This template has no configurable parameters.
  </div>

  <div class="tw-sections">
    <section *ngFor="let section of sections" class="tw-card">
      <div class="tw-card-title">{{ section.label }}</div>
      <form [formGroup]="section.form" class="tw-form">
        <formly-form
          [model]="section.model"
          [fields]="section.fields"
          [form]="section.form">
        </formly-form>
      </form>
    </section>
  </div>

  <div class="tw-actionbar" *ngIf="sections.length > 0">
    <span class="tw-action-hint">
      <ng-container *ngIf="wid !== undefined">Applied changes are reflected in the preview below.</ng-container>
      <ng-container *ngIf="wid === undefined">Submitting creates your workflow from this template.</ng-container>
    </span>
    <button
      nz-button
      nzType="primary"
      nzSize="large"
      class="tw-submit"
      [nzLoading]="isSubmitting"
      [disabled]="isSubmitting"
      (click)="onJobFormSubmitted()">
      {{ submitButtonText }}
    </button>
  </div>

  <div class="readonly-embedded-workspace-container" *ngIf="wid && showEmbeddedWorkspace">
    <div class="inner-scale">
      <texera-workspace
        [wid]="wid"
        [isEmbedded]="true"
        [mode]="'workflow'">
      </texera-workspace>
    </div>
  </div>
</div>
