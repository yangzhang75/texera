<h2 class="job-title">Build Workflow from Template:</h2>

<div *ngIf="sections.length === 0" class="empty-state">
  No configurable parameters in this template.
</div>

<div *ngFor="let section of sections" class="template-section">
  <h3 class="template-section-title">{{ section.label }}</h3>
  <form [formGroup]="section.form">
    <formly-form
      [model]="section.model"
      [fields]="section.fields"
      [form]="section.form">
    </formly-form>
  </form>
</div>

<span
  nz-tooltip
  [nzTooltipTitle]="isWorkflowExecutionActive ? 'Cannot submit properties while the workflow is running.' : null">
  <button
    nz-button
    nzType="primary"
    [disabled]="submitDisabled"
    (click)="onJobFormSubmitted()">
    SUBMIT
  </button>
</span>

<div
  class="readonly-embedded-workspace-container"
  *ngIf="wid && showEmbeddedWorkspace"
>
  <div class="inner-scale">
    <texera-workspace
      [wid]="wid"
      [isEmbedded]="true"
      [mode]="'workflow'"
    >
    </texera-workspace>
  </div>
</div>
