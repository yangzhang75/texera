<div class="tw-form">
  <header class="tw-header">
    <div class="tw-header-row">
      <h2 class="job-title">{{ macroId ? "Generate workflow from macro" : "Build workflow from template" }}</h2>
      <!-- Return to the Edit-macro config page (body + configurable properties). -->
      <button
        *ngIf="macroId"
        nz-button
        nzType="default"
        nzSize="small"
        class="tw-edit-macro"
        title="Edit macro — change its body and configurable properties"
        (click)="onEditMacro()">
        <i nz-icon nzType="experiment" nzTheme="outline"></i> Edit macro
      </button>
    </div>
    <p class="tw-subtitle">Set the parameters below, then submit to generate an independent workflow.</p>
  </header>

  <!-- Name for the generated workflow (macro flow): defaults to the macro name, editable. -->
  <label class="tw-name-field" *ngIf="macroId">
    <span class="tw-name-label">Workflow name</span>
    <input
      class="tw-name-input"
      [value]="genName"
      (input)="genName = $any($event.target).value"
      placeholder="Workflow name" />
  </label>

  <div *ngIf="sections.length === 0" class="empty-state">
    No configurable parameters{{ macroId ? " — submit to generate the workflow as-is." : " in this template." }}
  </div>

  <div *ngFor="let section of sections" class="template-section">
    <h3 class="template-section-title">{{ section.label }}</h3>
    <form [formGroup]="section.form" class="template-section-body">
      <formly-form [model]="section.model" [fields]="section.fields" [form]="section.form"> </formly-form>
    </form>
  </div>

  <div class="tw-actionbar" *ngIf="sections.length > 0 || macroId">
    <button
      nz-button
      nzType="primary"
      class="tw-submit"
      [class.tw-submit-idle]="submitIdle"
      [disabled]="submitDisabled || (!!macroId && !macroRunnable)"
      (click)="macroId ? onCreateWorkflowFromMacro() : onJobFormSubmitted()">
      {{ macroId ? "Create Workflow" : "Submit" }}
    </button>
  </div>
</div>

<!-- Read-only body preview. -->
<div class="readonly-embedded-workspace-container" *ngIf="wid && showEmbeddedWorkspace">
  <div class="inner-scale">
    <texera-workspace [wid]="wid" [isEmbedded]="true" [mode]="'workflow'"> </texera-workspace>
  </div>
</div>
