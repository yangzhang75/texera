<div class="tw-form">
  <header class="tw-header">
    <h2 class="job-title">Build Workflow from Template</h2>
    <p class="tw-subtitle">Set the parameters below, then apply them to your workflow. The preview updates after you submit.</p>
  </header>

  <div *ngIf="sections.length === 0" class="empty-state">
    No configurable parameters in this template.
  </div>

  <div *ngFor="let section of sections" class="template-section">
    <h3 class="template-section-title">{{ section.label }}</h3>
    <form [formGroup]="section.form" class="template-section-body">
      <formly-form
        [model]="section.model"
        [fields]="section.fields"
        [form]="section.form">
      </formly-form>
    </form>
  </div>

  <div class="tw-actionbar" *ngIf="sections.length > 0">
    <button
      nz-button
      nzType="primary"
      class="tw-submit"
      [class.tw-submit-idle]="submitIdle"
      [disabled]="submitDisabled"
      nz-tooltip
      [nzTooltipTitle]="submitIdle ? 'No changes to apply yet' : ''"
      (click)="onJobFormSubmitted()">
      Submit
    </button>
  </div>
</div>

<div
  class="readonly-embedded-workspace-container"
  *ngIf="wid && showEmbeddedWorkspace"
>
  <div class="inner-scale">
    <texera-workspace
      [wid]="wid"
      [isEmbedded]="true"
      [mode]="'workflow'"
    >
    </texera-workspace>
  </div>
</div>
