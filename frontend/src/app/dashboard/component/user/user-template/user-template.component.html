<div class="section-container subsection-grid-container">
  <nz-card class="section-title">
    <h2 class="page-title">Templates</h2>
    <div class="button-group">
      <button
        nz-button
        class="create-btn"
        (click)="onClickCreateNewTemplateFromDashboard()"
        title="Create a new template">
        <i
          nz-icon
          nzType="file-add"
          nzTheme="outline"></i>
        <span>Create Template</span>
      </button>
      <nz-space-compact
        class="utility-button-group"
        ngbDropdown>
        <texera-sort-button (sortMethodChange)="sortMethod = $event; search()"></texera-sort-button>
        <nz-upload [nzBeforeUpload]="onClickUploadExistingTemplateFromLocal">
          <button
            nz-button
            title="Upload ZIP/JSON file as template"
            nz-tooltip="Upload ZIP/JSON file as template"
            nzTooltipPlacement="bottom"
            type="button">
            <i
              nz-icon
              nzType="cloud-upload"
              nzTheme="outline"></i>
          </button>
        </nz-upload>
        <button
          *ngIf="multiTemplatesOperationButtonEnabled()"
          (click)="toggleSelection()"
          nz-button
          nzType="default"
          [nz-tooltip]="selectionTooltip"
          nzTooltipPlacement="bottom"
          title="Batch Select"
          type="button">
          <i
            nz-icon
            nzType="select"
            nzTheme="outline"></i>
        </button>
        <button
          *ngIf="multiTemplatesOperationButtonEnabled()"
          (click)="onClickOpenDownloadZip()"
          nz-button
          title="Download added template as a ZIP file"
          nz-tooltip="Download added template as a ZIP file"
          nzTooltipPlacement="bottom"
          type="button">
          <i
            nz-icon
            nzType="cloud-download"
            nzTheme="outline"></i>
        </button>
        <button
          *ngIf="multiTemplatesOperationButtonEnabled()"
          (click)="onClickDuplicateSelectedTemplates()"
          nz-button
          nz-tooltip="Duplicate selected templates"
          nzTooltipPlacement="bottom"
          type="button">
          <i
            nz-icon
            nzTheme="outline"
            nzType="copy"></i>
        </button>
        <button
          *ngIf="multiTemplatesOperationButtonEnabled()"
          nz-popconfirm
          nzPopconfirmTitle="Confirm to delete selected templates."
          nz-button
          nz-tooltip="Delete selected templates"
          (nzOnConfirm)="handleConfirmDeleteSelectedTemplates()"
          nzTooltipPlacement="bottom">
          <i
            nz-icon
            nzTheme="outline"
            nzType="delete"></i>
        </button>
      </nz-space-compact>
      <texera-filters #filters></texera-filters>
    </div>
  </nz-card>

  <div class="section-search-bar template-search-bar">
    <texera-filters-instructions></texera-filters-instructions>
    <nz-select
      class="search-input-box"
      name="search-input-box"
      nzMode="tags"
      nzPlaceHolder="Search all templates"
      nzVariant="borderless"
      [nzOpen]="false"
      ngDefaultControl
      [(ngModel)]="filters.masterFilterList"
      [nzAllowClear]="true">
    </nz-select>
  </div>

  <texera-search-results
    [editable]="true"
    [isPrivateSearch]="true"
    (deleted)="deleteTemplate($event)"
    (refresh)="refreshSearchResult()"
    (duplicated)="onClickDuplicateTemplate($event)"
    [currentUid]="currentUid"
    (notifyWorkflow)="updateTooltip()"></texera-search-results>
</div>
